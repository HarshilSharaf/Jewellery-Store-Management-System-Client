<div class="card my-3 chart-card">
  <div class="card-title mb-1 p-3 d-flex ">
    <h6>Top Selling Products</h6>
  </div>
  <div class="card-body text-center">
    <div class="chart-container align-items-center justify-content-center">
      @if (_topSellingProducts.length == 0) {
        <app-skeleton-loader
          [count]="1"
          [shapeOfLoader]="'circle'"
          [theme]="{'height': '100%', width: '50%'}" />
      }
      <canvas id="pieChart" [hidden]="_topSellingProducts.length == 0">{{ chart }}</canvas>
    </div>
  </div>
</div>
