<div class="login-wrapper">
  <div class="login-card animate__animated animate__fadeIn">

    <!-- Left: Brand Panel -->
    <div class="brand-panel">
      <div class="brand-content">
        <img src="./assets/img/logo.png" alt="Logo" class="brand-logo">
        <h1 class="brand-title">Jewellery Store</h1>
        <p class="brand-subtitle">Management System</p>
      </div>
      <div class="brand-decoration">
        <div class="decoration-circle circle-1"></div>
        <div class="decoration-circle circle-2"></div>
        <div class="decoration-circle circle-3"></div>
      </div>
    </div>

    <!-- Right: Login Form -->
    <div class="form-panel">
      <div class="form-content">
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-subtitle">Sign in to continue to your dashboard</p>

        @if (showError) {
          <div class="error-banner animate__animated animate__shakeX">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{errorMessage}}</span>
          </div>
        }

        <form (ngSubmit)="login($event)">
          <div class="form-field">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user input-icon"></i>
              <input type="text" id="username" name="username"
                placeholder="Enter your username"
                [(ngModel)]="credentials.username"
                autocomplete="username">
            </div>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="password" name="password"
                placeholder="Enter your password"
                [(ngModel)]="credentials.password"
                autocomplete="current-password">
            </div>
          </div>

          <div class="form-actions">
            <a href="" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">
            <span>Sign In</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
