<button type="button"
    class="cart-btn"
    [class.cart-btn--shake]="animateCartIcon"
    (click)="openCartDetails()"
    aria-label="Open cart">
    <ng-icon name="lucideShoppingBag" class="cart-btn__icon" aria-hidden="true"></ng-icon>
    @if (totalItems > 0) {
      <span class="cart-btn__badge tabular-nums" aria-hidden="true">{{ totalItems }}</span>
    }
    <span class="visually-hidden">{{ totalItems }} items in cart</span>
</button>
