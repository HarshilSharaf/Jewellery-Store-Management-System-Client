<nav class="navbar navbar-expand-md fixed-top navbar-dark flex-fill">

  <!-- header -->
  <div class="navbar-header pl-2 pr-2 ml-3 text-center">
    <a class="navbar-brand m-0 w-100" href="#">
      <img src="./assets/img/logo.png" alt="lightning logo" width="35px">
      <span class="ml-1" style="margin-left: 5px !important;">Jewellery Store </span>
    </a>
  </div>

  <!-- sidebar toggler -->
  <div class="sidebar-toggler ml-auto mr-3">
    <button type="button" class="btn nav-link" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fa fa-bars fa-lg" aria-hidden="true"></i>
    </button>
  </div>



  <!-- left box -->
  <ul class="navbar-nav flex-fill mt-1 align-items-center left-nav">
    <li class="nav-item navicon">
      <button type="button" class="btn nav-link" (click)="toggleSidebarPin()" aria-label="Pin sidebar">
        <i class="fa fa-bars fa-xl" aria-hidden="true"></i>
      </button>
    </li>
    <li class="nav-item nav-item--search">
      <label for="navbar-search" class="visually-hidden">Search</label>
      <input id="navbar-search" class="form-control navbar-search" type="text" placeholder="Search . . ." aria-label="Search">
    </li>
  </ul>

  <!-- userDisplayName section -->
  <div class="user-display-name d-md-flex d-none">
    <span class="text-white">
      {{userDisplayName()}}
    </span>
  </div>

  <!-- profile icon dropdown -->
  @if (userID > 0) {
    <app-profile-dropdown [userID]="userID"></app-profile-dropdown>
  }

  <!-- cart pinned to the far right -->
  <div class="nav-item nav-item--cart">
    <app-add-to-cart></app-add-to-cart>
  </div>

</nav>
