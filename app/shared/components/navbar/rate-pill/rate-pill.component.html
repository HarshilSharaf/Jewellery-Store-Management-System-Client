<div class="rate-pill-wrap">
  <button #trigger type="button"
          class="rate-pill"
          [class.is-open]="open()"
          (click)="toggle()"
          [attr.aria-expanded]="open()"
          aria-haspopup="dialog"
          aria-label="Today's rates">
    <ng-icon name="lucideIndianRupee" size="14" aria-hidden="true"></ng-icon>
    <span class="rate-pill__label tabular-nums">{{ summary() }}</span>
  </button>

  @if (open()) {
    <div #popover class="rate-popover" role="dialog" aria-label="Today's rates">
      <header class="rate-popover__head">
        <div class="rate-popover__title">Today's rates</div>
        <button type="button" class="rate-popover__close" (click)="close()" aria-label="Close">
          <ng-icon name="lucideX" size="14" aria-hidden="true"></ng-icon>
        </button>
      </header>

      <div class="rate-popover__meta">
        <label class="rate-popover__field">
          <span>Date</span>
          <input type="date" class="hlm-input tabular-nums" [value]="effectiveDate()" (input)="effectiveDate.set($any($event.target).value)">
        </label>
        <div class="session-toggle" role="group" aria-label="Session">
          <button type="button" class="session-btn" [class.is-active]="session() === 'AM'" (click)="session.set('AM')">AM</button>
          <button type="button" class="session-btn" [class.is-active]="session() === 'PM'" (click)="session.set('PM')">PM</button>
        </div>
      </div>

      @if (loading()) {
        <div class="rate-popover__loading">Loading rates…</div>
      } @else {
        <div class="rate-editors">
          @for (r of editors(); track r.purityCode) {
            <div class="rate-editor-row">
              <div class="rate-editor-row__label">
                <span class="chip chip--purity">{{ r.purityLabel }}</span>
              </div>
              <label class="rate-editor-row__field">
                <span>AM</span>
                <input type="number" class="hlm-input tabular-nums" [value]="r.am ?? ''" (input)="onAmChange(r.purityCode, $any($event.target).value)" step="1">
              </label>
              <label class="rate-editor-row__field">
                <span>PM</span>
                <input type="number" class="hlm-input tabular-nums" [value]="r.pm ?? ''" (input)="onPmChange(r.purityCode, $any($event.target).value)" step="1">
              </label>
            </div>
          }
        </div>
      }

      <footer class="rate-popover__actions">
        <button type="button" class="hlm-btn hlm-btn-ghost" (click)="openFullEditor()">
          Full editor
          <ng-icon name="lucideChevronRight" size="14" aria-hidden="true"></ng-icon>
        </button>
        <button type="button" class="hlm-btn hlm-btn-primary" (click)="save()" [disabled]="saving() || loading()">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
      </footer>
    </div>
  }
</div>
