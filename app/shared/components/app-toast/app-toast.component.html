<div class="app-toast-stack" data-position="top-end" aria-live="polite">
  @for (t of service.items(); track trackById($index, t)) {
    <div
      class="app-toast-item"
      [attr.data-variant]="t.variant"
      (mouseenter)="onPause(t.id)"
      (mouseleave)="onResume(t.id)"
      role="status">
      <span class="app-toast-icon" [attr.data-variant]="t.variant">
        <ng-icon [name]="iconName(t.variant)" size="16" aria-hidden="true"></ng-icon>
      </span>
      <div class="app-toast-body">
        @if (t.title) {
          <div class="app-toast-title">{{ t.title }}</div>
        }
        @if (t.text) {
          <div class="app-toast-text">{{ t.text }}</div>
        }
      </div>
      <button type="button" class="app-toast-close" (click)="onDismiss(t.id)" aria-label="Dismiss">
        <ng-icon name="lucideX" size="12" aria-hidden="true"></ng-icon>
      </button>
      @if (t.timer > 0) {
        <span class="app-toast-progress" [style.animation-duration.ms]="t.timer"></span>
      }
    </div>
  }
</div>
