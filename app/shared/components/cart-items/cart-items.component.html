@if (cartItems().length > 0) {
  @for (item of cartItems(); track item.productGuid ?? $index) {
    <div class="row mb-4 border border-3 border-info p-3 rounded">
      <div class="col-3 align-self-center">
        <img [src]="item.image" class="border border-2 rounded" width="50" height="50">
      </div>
      <div class="col align-self-center">
        <div class="row">
          <h6>
            {{item.sku}} @if (item.huid) { <small class="text-muted">· {{item.huid}}</small> }
          </h6>
        </div>
        <div class="row">
          <div class="col">
            <small class="text-muted">
              {{item.subCategory}} · {{item.masterCategory}}
            </small>
          </div>
          <div class="col">
            <small class="text-muted tabular-nums">
              Net: {{item.netWeight}}g · {{item.purityCode}}
            </small>
          </div>
        </div>
      </div>
      <div class="col-2 align-self-center text-center">
        <button class="btn btn-danger" (click)="removeItem(item)">
          <i class="fa-solid fa-circle-minus "></i>
        </button>
      </div>
    </div>
  }
} @else {
  <div class="row my-5 text-center">
    <div class="maxImage">
      <img src="./assets/img/cart-empty.png" style="object-fit: contain">
    </div>
  </div>
}
