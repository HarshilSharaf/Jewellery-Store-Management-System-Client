@if (isOpen) {
  <div class="cart-backdrop" (click)="onBackdropClick()" role="presentation"></div>
}
<aside class="cart-panel" [class.is-open]="isOpen" role="dialog" aria-labelledby="cart-panel-title" aria-modal="true">
  <header class="cart-panel__head">
    <h4 id="cart-panel-title" class="cart-panel__title">Cart</h4>
    <button type="button" class="icon-btn" (click)="close()" aria-label="Close cart">
      <ng-icon name="lucideX" aria-hidden="true"></ng-icon>
    </button>
  </header>
  <div class="cart-panel__body">
    <app-cart-items></app-cart-items>
  </div>
  <footer class="cart-panel__foot">
    <a routerLink="/orders/prepare-order" class="hlm-btn hlm-btn-primary cart-panel__cta" (click)="close()">
      Go to Sell
    </a>
    <button type="button" class="hlm-btn hlm-btn-ghost" (click)="close()">Close</button>
  </footer>
</aside>
