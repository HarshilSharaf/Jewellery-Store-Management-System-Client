<!-- Backdrop -->
<div class="cart-backdrop" [class.show]="isOpen" (click)="onBackdropClick()"></div>

<!-- Side panel -->
<div class="cart-panel" [class.open]="isOpen">
  <div class="cart-panel-header">
    <h4>Cart Items</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
  </div>
  <hr>
  <div class="cart-panel-body">
    <app-cart-items></app-cart-items>
  </div>
  <div class="cart-panel-footer">
    <button type="button" class="btn btn-outline-dark" (click)="close()">Close</button>
  </div>
</div>
